<div class="page-stack"><div class="toolbar"><div class="page-title"><h2>Veículos</h2><p>Gerencie os veículos cadastrados</p></div><button class="btn btn-primary" (click)="modal=true">＋ Cadastrar Veículo</button></div><section class="card"><div class="card-body"><input class="input" [(ngModel)]="search" placeholder="Buscar por placa, modelo ou proprietário..."></div><div class="table-wrap"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Cor</th><th>Proprietário</th><th>Tipo</th></tr></thead><tbody>@for(v of filtered;track v.plate){<tr><td><strong>{{v.plate}}</strong></td><td>{{v.model}}</td><td>{{v.color}}</td><td>{{v.owner}}</td><td><span class="badge badge-blue">{{v.type}}</span></td></tr>}</tbody></table></div></section></div>
@if(modal){<div class="modal-backdrop"><section class="modal"><div class="card-header toolbar"><div><h3>Cadastrar Veículo</h3><p>Preencha as informações do novo veículo</p></div><button class="btn btn-secondary" (click)="modal=false">×</button></div><form class="card-body grid" (ngSubmit)="save()"><div class="grid grid-2"><div class="field"><label>Placa *</label><input class="input" name="plate" [(ngModel)]="form.plate"></div><div class="field"><label>Tipo</label><select class="input" name="type" [(ngModel)]="form.type"><option>Carro</option><option>Moto</option><option>Outro</option></select></div><div class="field"><label>Modelo</label><input class="input" name="model" [(ngModel)]="form.model"></div><div class="field"><label>Cor</label><input class="input" name="color" [(ngModel)]="form.color"></div></div><div class="field"><label>Proprietário *</label><input class="input" name="owner" [(ngModel)]="form.owner"></div><div class="modal-actions"><button type="button" class="btn btn-secondary" (click)="modal=false">Cancelar</button><button class="btn btn-primary">Salvar Veículo</button></div></form></section></div>}
