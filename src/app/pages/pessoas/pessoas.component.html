<div class="page-stack"><div class="toolbar"><div class="page-title"><h2>Pessoas</h2><p>Gerencie alunos, professores, funcionários e visitantes</p></div><button class="btn btn-primary" (click)="modal=true">＋ Cadastrar Pessoa</button></div><section class="card"><div class="card-body"><input class="input" [(ngModel)]="search" placeholder="Buscar por nome, documento ou e-mail..."></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Documento</th><th>Contato</th><th>Tipo</th></tr></thead><tbody>@for(p of filtered;track p.document){<tr><td><strong>{{p.name}}</strong></td><td>{{p.document}}</td><td>{{p.email}}<br><span class="muted">{{p.phone}}</span></td><td><span class="badge badge-blue">{{p.type}}</span></td></tr>}</tbody></table></div></section></div>
@if(modal){<div class="modal-backdrop"><section class="modal"><div class="card-header toolbar"><div><h3>Cadastrar Pessoa</h3><p>Preencha os dados pessoais</p></div><button class="btn btn-secondary" (click)="modal=false">×</button></div><form class="card-body grid" (ngSubmit)="save()"><div class="field"><label>Nome completo *</label><input class="input" name="name" [(ngModel)]="form.name"></div><div class="grid grid-2"><div class="field"><label>CPF/Documento *</label><input class="input" name="document" [(ngModel)]="form.document"></div><div class="field"><label>Tipo</label><select class="input" name="type" [(ngModel)]="form.type"><option>Aluno</option><option>Professor</option><option>Funcionário</option><option>Visitante</option></select></div><div class="field"><label>E-mail</label><input class="input" name="email" [(ngModel)]="form.email"></div><div class="field"><label>Telefone</label><input class="input" name="phone" [(ngModel)]="form.phone"></div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" (click)="modal=false">Cancelar</button><button class="btn btn-primary">Salvar Pessoa</button></div></form></section></div>}
